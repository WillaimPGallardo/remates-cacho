# Despliegue (Arquitectura · Tabla de despliegue): nginx + api + postgres en una red interna.
# Uso: docker compose -f infra/docker-compose.yml up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: remates_cacho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - datos:/var/lib/postgresql/data
      - ../db/migraciones:/docker-entrypoint-initdb.d:ro   # crea el esquema la primera vez
    restart: unless-stopped
  api:
    build: { context: .., dockerfile: infra/Dockerfile }
    environment:
      DATABASE_URL: postgres://app_remates:${APP_DB_PASSWORD:?defina APP_DB_PASSWORD}@postgres:5432/remates_cacho
    depends_on: [postgres]
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificados:/etc/nginx/certificados:ro   # certificado TLS (Let's Encrypt)
    depends_on: [api]
    restart: unless-stopped
volumes:
  datos:
